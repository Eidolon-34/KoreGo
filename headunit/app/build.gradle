plugins { id 'com.android.application' }
android {
    namespace 'com.heathen.persephone'
    compileSdk 35
    defaultConfig { applicationId 'com.eidolon.korego'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes { release { minifyEnabled false } }
}

dependencies { implementation "androidx.exifinterface:exifinterface:1.4.2"; testImplementation "junit:junit:4.13.2"; testImplementation "org.robolectric:robolectric:4.14.1" }
